name: Restaurant Service CI (Self-hosted)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-on-self-hosted:
    name: Build with Self-hosted Runner
    runs-on: [self-hosted, quickbite, restaurant-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew & Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-service-artifact
          path: build/libs/*.jar
          retention-days: 3